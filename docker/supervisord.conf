[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisor/supervisord.pid
user=root

[program:octane]
command=/usr/local/bin/php /app/artisan octane:frankenphp --host=0.0.0.0 --port=%(ENV_APP_PORT)s --workers=auto --max-requests=500
directory=/app
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
user=www-data
priority=10

[program:queue]
command=/usr/local/bin/php /app/artisan queue:work --sleep=1 --tries=3 --timeout=120 --max-time=3600
directory=/app
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
user=www-data
priority=20

[program:reverb]
command=/usr/local/bin/php /app/artisan reverb:start --host=0.0.0.0 --port=%(ENV_REVERB_SERVER_PORT)s --no-interaction
directory=/app
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
user=www-data
priority=25

[program:scheduler]
command=/usr/local/bin/php /app/artisan schedule:work
directory=/app
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
user=www-data
priority=30
